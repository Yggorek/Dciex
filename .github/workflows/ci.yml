
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Dciex.sln

            - name: Build solution
        run: dotnet build Dciex.sln --configuration Release --no-restore

      - name: Inspect FakeDocker output
        shell: pwsh
        run: |
          Write-Host "FakeDocker source output:"
          Get-ChildItem tests/Dciex.Tests/Docker/Compose/FakeDocker/bin/Release/net10.0/ -ErrorAction SilentlyContinue

          Write-Host "FakeDocker test output:"
          Get-ChildItem tests/Dciex.Tests/bin/Release/net10.0/FakeDocker/ -ErrorAction SilentlyContinue

      - name: Run tests
        run: dotnet test Dciex.sln --configuration Release --no-build --no-restore